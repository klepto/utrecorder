name: utrecorder

services:
  server:
    build:
      context: ..
      dockerfile: docker/server/Dockerfile
    image: utrecorder-server
    init: true
    ports:
      - "8080:8080"
    volumes:
      - server-home:/var/lib/utrecorder
    # Any UTRECORDER_* key, such as the Internet Archive keys, set in docker/.env. The file is optional and gitignored.
    env_file:
      - path: .env
        required: false
    # The shutdown hook waits for a cancelled recording to kill the game and ffmpeg and clean up its workspace.
    stop_grace_period: 1m
    # At most four cores of CPU time. The JVM reads the limit, so the llvmpipe thread count follows it.
    cpus: 4

volumes:
  server-home:
