name: utrecorder

services:
  dev:
    build: dev
    image: utrecorder-dev
    init: true
    stdin_open: true
    tty: true
    volumes:
      # The checkout, read-only. The entrypoint syncs it into /utrecorder on every start.
      - ..:/source:ro
      # The container's copy of the checkout, kept so Gradle builds incrementally across runs.
      - checkout:/utrecorder
      # The repository's .utrecorder is the home, so workspaces and downloads show up on the host as they are written.
      - ../.utrecorder:/var/lib/utrecorder
      # The Linux installs, kept apart from the Windows ones the host materializes in the same home.
      - installs:/var/lib/utrecorder/installs
      - gradle:/root/.gradle

  server:
    build:
      context: ..
      dockerfile: docker/server/Dockerfile
    image: utrecorder-server
    init: true
    ports:
      - "8080:8080"
    volumes:
      - server-home:/var/lib/utrecorder
    environment:
      UTRECORDER_SERVER_ARCHIVE_ACCESS_KEY:
      UTRECORDER_SERVER_ARCHIVE_SECRET_KEY:

volumes:
  checkout:
  installs:
  gradle:
  server-home:
