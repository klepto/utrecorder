# Overrides on top of detekt's own default configuration. Only the rules whose
# defaults disagree with the code style of this repository appear here.

complexity:
  # Shared helper files group many small functions by area on purpose.
  TooManyFunctions:
    allowedFunctionsPerFile: 30
  # Two levels of control flow, plus one for a resource or scope-function lambda,
  # which detekt counts as a block of its own.
  NestedBlockDepth:
    allowedDepth: 3

exceptions:
  # A caught exception is rethrown or wrapped, whatever its variable is named.
  SwallowedException:
    active: true
    allowedExceptionNameRegex: ''
  TooGenericExceptionCaught:
    active: true

style:
  # Reporting each failure mode separately is preferred over funnelling throws.
  ThrowsCount:
    active: false
  # ktlint owns line length, through max_line_length in .editorconfig.
  MaxLineLength:
    active: false
  # Guard clauses are the documented way to keep nesting shallow.
  ReturnCount:
    excludeGuardClauses: true
  LoopWithTooManyJumpStatements:
    active: false
