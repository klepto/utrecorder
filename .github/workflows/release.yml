# Publishes ghcr.io/klepto/utrecorder-server:<version> when release.sh starts it on the tag v<version>. A release
# version is version= in gradle.properties at the tag. A development build version is <base>-dev.<commit>, where <base>
# is that version without its pre-release suffix and <commit> is the short hash of the tagged commit; it is passed to
# the build instead of committed. A version names one image forever: the job fails when the image already exists, and
# no latest tag is ever pushed.
name: Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish, from the tag v<version> the workflow runs on.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/klepto/utrecorder-server

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          if [ "$GITHUB_REF" != "refs/tags/v$INPUT" ]; then
            echo "::error::Release $INPUT runs on $GITHUB_REF, not on the tag v$INPUT"
            exit 1
          fi
          case "$INPUT" in
            *-dev.*)
              hash=${INPUT##*-dev.}
              if [ "${INPUT%-dev.*}" != "${version%%-*}" ]; then
                echo "::error::Development build $INPUT does not start with ${version%%-*}, from version=$version in gradle.properties"
                exit 1
              fi
              case "$GITHUB_SHA" in
                "$hash"*) ;;
                *)
                  echo "::error::Development build $INPUT does not name the tagged commit $GITHUB_SHA"
                  exit 1
                  ;;
              esac
              ;;
            *)
              if [ "$INPUT" != "$version" ]; then
                echo "::error::Version $INPUT does not match version=$version in gradle.properties at $GITHUB_REF_NAME"
                exit 1
              fi
              ;;
          esac
          echo "version=$INPUT" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing image
        env:
          REFERENCE: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
        run: |
          if output=$(docker manifest inspect "$REFERENCE" 2>&1); then
            echo "::error::$REFERENCE already exists; release a new patch version instead"
            exit 1
          fi
          case "$output" in
            *"manifest unknown"*|*"not found"*|*"no such manifest"*) ;;
            *)
              echo "::error::Could not check whether $REFERENCE exists: $output"
              exit 1
              ;;
          esac

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Restores only: a cache saved on a tag is readable by that tag alone, so no later release could use it.
      - name: Restore the BuildKit cache mounts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/buildkit-cache
          key: buildkit-cache-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: buildkit-cache-

      - name: Inject the cache mounts into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {
              "${{ runner.temp }}/buildkit-cache/gradle": "/root/.gradle",
              "${{ runner.temp }}/buildkit-cache/utrecorder": "/utrecorder/.utrecorder/cache"
            }
          scratch-dir: ${{ runner.temp }}/buildkit-scratch
          skip-extraction: true

      - name: Build and push the server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: server
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
